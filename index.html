<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Starting Lineup</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <h1>Starting Lineup</h1>

  <!--Status radio menu with Final selected by default-->
  <div id="statusMenu">
    <fieldset>
      <legend>Status:</legend>

        <input type="radio" id="status-draft" name="status" value="Draft">
        <label for="status-draft">Draft</label>

        <input type="radio" id="status-final" name="status" value="Final" checked>
        <label for="status-final">Final</label>

    </fieldset>
  </div>

<!--Date drop-down menu -->
  <div id="dateMenu">
    <label>Date:</label>

      <select id="date-options" name="gameDate">
        <option value="March 20">March 20</option>
        <option value="March 24">March 24</option>
        <option value="April 2">April 2</option>
        <option value="April 6">April 6</option>
        <option value="April 13">April 13</option>
      </select>
  </div>

  <!--Player check box menu-->
  <div id="playerMenu">
    <fieldset>
      <legend>Players:</legend>

        <input type="checkbox" id="player1">
        <label for="player1">Aarav Agarwal</label>
        <br>

        <input type="checkbox" id="player2">
        <label for="player2">Ava Johnson</label>
        <br>

        <input type="checkbox" id="player3">
        <label for="player3">Julio Ortiz</label>
        <br>

        <input type="checkbox" id="player4">
        <label for="player4">Liam Rubio</label>
        <br>

        <input type="checkbox" id="player5">
        <label for="player5">Emma Witherspoon</label>
        <br>
    </fieldset>
  </div>

<!--Submit button-->
  <div id="button">
    <button type="submit" id="submit">Submit</button>
  </div>

</body>

</html>
